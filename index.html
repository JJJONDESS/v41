<!DOCTYPE html>
<!-- ============================================================
     Melt9 AR Menu - simple pizza + realistic steam - index.html
     ------------------------------------------------------------
     HOW IT WORKS
     - Menu page (no ?item=): list of dishes from dishes.js.
     - Dish page (?item=mcart): 3D view first.
       * iPhone: "View in your space" opens Apple Quick Look.
       * Android: "Scan the menu photo" opens the camera
         (A-Frame + MindAR, loaded from the libs/ folder).
     - In AR the pizza sits inside a branded glass box
       (no dome, no glass box, no cylinder - just the pizza
       with realistic steam rising from it, like hot food).
     - Add to cart / Photo buttons appear at the bottom in AR.

     FILES THAT MUST BE UPLOADED TOGETHER
     - index.html, app.js, dishes.js, kitchen.html
     - libs/ (aframe.min.js + mindar-image-aframe.prod.js)
     - dishes/ (models, photos, shadow.png, steam.png)

     TO CHANGE SOMETHING, SEARCH FOR THESE MARKERS
     - "BRAND COLOURS"  : Melt9 yellow #FFC20F / black #000000
     - "STEAM"          : steam planes, speed, opacity, height
     - "AR LABEL"       : the fixed name + price label on screen
     - "AR ACTIONS"     : Add to cart + Photo buttons in AR
     - "SETTINGS"       : the few on/off switches near the top
       of the script (SHOW_AR_ON_ANDROID etc.)
     ============================================================ -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu AR</title>
<script src="dishes.js"></script>
<!-- The menu page loads nothing heavy. On a dish page the 3D viewer loads first (see the script below), so the dish appears quickly. The camera/AR engine (A-Frame + MindAR) loads afterwards in the background. -->
<script type="module" src="app.js"></script>
<style>
  /* IMPORTANT: no background on html/body, or it hides the camera feed */
  html, body { margin: 0; height: 100%; background: transparent; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  .a-enter-vr, .a-enter-ar { display: none !important; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px; text-align: center; background: #1c1410; z-index: 20; }
  .screen.on { display: flex; }
  h1 { font-size: 1.6rem; margin: 0 0 8px; }
  p { max-width: 30ch; line-height: 1.5; color: #e8d9cc; margin: 0 0 20px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 14px 28px; margin: 6px;
           background: #e8452c; color: #fff; }
  button.plain { background: transparent; border: 1px solid #8a7466; color: #e8d9cc; }
  button:disabled { opacity: .55; }
  #errmsg { max-width: 36ch; }
  #errcode { font-size: .75rem; opacity: .7; max-width: 36ch; word-break: break-word; }
  button:focus-visible { outline: 3px solid #ffd27a; outline-offset: 2px; }
  #hint { position: fixed; left: 0; right: 0; bottom: 24px; text-align: center; z-index: 10; pointer-events: none;
          text-shadow: 0 1px 4px #000; transition: opacity .3s; }
  #hud { position: fixed; top: 12px; right: 12px; z-index: 15; display: none; }
  #hud button { padding: 8px 16px; background: rgba(0,0,0,.55); font-size: .9rem; }
  /* ===== FIXED AR LABEL - change this to move / resize the label yourself =====
     top:    bigger number = lower on the screen, smaller = higher
     font-size: bigger = bigger text. padding: space inside the glass box. */
  #arlabel { display: none; position: fixed; top: calc(58px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
             z-index: 14; pointer-events: none; text-align: center; padding: 8px 18px; border-radius: 14px;
             background: rgba(0,0,0,.55); border: 1px solid #FFC20F; color: #fff; font-weight: 700; font-size: 1.05rem; line-height: 1.25;
             white-space: nowrap; max-width: 92vw; }
  #arlabel .pr { display: block; color: #FFC20F; font-size: .95rem; }
  #arlabel .rn { display: block; color: #FFC20F; font-size: .72rem; letter-spacing: .12em; }
  /* AR actions: Add to cart + Photo, bottom centre, only in AR - Melt9 colours #FFC20F / #000000 */
  #aractions { display: none; position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(68px + env(safe-area-inset-bottom, 0px)); z-index: 14; gap: 10px; width: max-content; max-width: 94vw; flex-wrap: nowrap; }
  #aractions button { flex: 0 0 auto; white-space: nowrap; margin: 0; padding: 13px 18px; border-radius: 999px; font-weight: 700; font-size: .92rem; line-height: 1; box-shadow: 0 4px 14px rgba(0,0,0,.45); }
  #hudadd { background: #FFC20F; color: #000000; }
  #hudphoto { background: #000000; color: #FFC20F; border: 1px solid #FFC20F; }
  button.alt { background: #fff; color: #1c1410; }
  #start { padding: 0; justify-content: flex-end; }
  #start model-viewer { position: absolute; inset: 0; width: 100%; height: 100%; --poster-color: transparent;
                        background: radial-gradient(circle at 50% 42%, #3a2a20, #1c1410 70%); }
  #start .top { position: absolute; top: 0; left: 0; right: 0; z-index: 2; pointer-events: none;
                padding: calc(28px + env(safe-area-inset-top, 0px)) 24px 0; text-shadow: 0 1px 6px #000; }
  #start .top p { margin: 0 auto; }
  #start .ui { position: relative; z-index: 2; width: 100%; box-sizing: border-box; display: flex; flex-direction: column;
               align-items: center; pointer-events: none;
               padding: 80px 24px calc(24px + env(safe-area-inset-bottom, 0px));
               background: linear-gradient(transparent, rgba(28,20,16,.92) 55%); }
  #start .ui button { pointer-events: auto; width: min(100%, 320px); box-sizing: border-box; }
  #start .back3d { display: none; position: absolute; left: 0; right: 0; top: 0; z-index: 3; justify-content: space-between;
                   pointer-events: none; padding: calc(12px + env(safe-area-inset-top, 0px)) 12px 0; }
  #start .back3d button { pointer-events: auto; padding: 10px 18px; }
  #start.only3d .top, #start.only3d .ui { display: none; }
  #start.only3d .back3d { display: flex; }
  #start .row { display: flex; gap: 8px; width: min(100%, 320px); pointer-events: auto; }
  #start .row button { width: auto; flex: 1; padding: 12px 8px; }
  button.wa { background: #1fa855; }
  #sheet { display: none; position: absolute; inset: 0; z-index: 5; background: rgba(0,0,0,.6); align-items: flex-end; }
  #sheet.on { display: flex; }
  #sheet .card { background: #2a1e18; width: 100%; box-sizing: border-box; text-align: left; max-height: 75%; overflow: auto;
                 padding: 24px 24px calc(24px + env(safe-area-inset-bottom, 0px)); border-radius: 20px 20px 0 0; }
  #sheet h2 { margin: 0 0 12px; }
  #sheet p { max-width: none; margin: 0 0 10px; }
  /* Light theme for the start page (white background + soft shadow under the dish) */
  #start { background: #fff; color: #222; }
  #start model-viewer { background: #fff; }
  #start .top { text-shadow: none; }
  #start .top p { color: #666; }
  #start .ui { background: linear-gradient(rgba(255,255,255,0), #fff 55%); }
  #start button.plain { border-color: #c9c9c9; color: #333; }
  #start button.alt { background: #fff; color: #1a1a1a; border: 1px solid #c9c9c9; }
  #sheet { background: rgba(0,0,0,.35); }
  #sheet .card { background: #fff; color: #222; box-shadow: 0 -4px 24px rgba(0,0,0,.15); }
  #sheet p { color: #444; }
  /* Layout v2: title on top, 3D model in the middle, buttons at the bottom (nothing overlaps the dish) */
  #start .top { position: static; order: -1; width: 100%; box-sizing: border-box; padding: calc(20px + env(safe-area-inset-top, 0px)) 24px 0; }
  #start model-viewer { position: relative; inset: auto; flex: 1 1 0; min-height: 0; align-self: stretch; width: auto; height: auto; }
  #start.only3d model-viewer { flex: 1 1 100%; }
  #start .ui { padding: 8px 24px calc(32px + env(safe-area-inset-bottom, 0px)); background: none; }
  #start .ui button { padding: 13px 24px; }
  #start .ui #go { padding: 15px 24px; }
  #start .ui .wa, #start .ui #info { background: none; border: 0; color: #1a8f4a; padding: 8px; width: auto; font-size: .95rem; }
  #start .ui #info { color: #555; text-decoration: underline; }
  /* Poster picture: a normal image shown instantly, while the 3D viewer is still loading */
  #posterimg { position: absolute; z-index: 1; object-fit: contain; pointer-events: none; background: #fff; transition: opacity .35s; }

  /* ===== Ordering: cart button, cart drawer, order status (only visible when app.js has Firebase set up) ===== */
  #cartui { display: none; }
  body.ordering-on #cartui { display: block; }
  body.hide-fab #cartfab, body.hide-fab #orderpill { display: none !important; }
  #cartui button { font: inherit; margin: 0; }
  #cartui, #cartui * { user-select: none; -webkit-user-select: none; }
  #cartfab { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 40; width: 46px; height: 46px; padding: 0;
             border-radius: 50%; background: #fff; border: 1px solid #ddd; box-shadow: 0 2px 10px rgba(0,0,0,.15); font-size: 1.3rem; line-height: 1; color: #222; }
  #cartbadge { display: none; position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box;
               border-radius: 10px; background: #e8452c; color: #fff; font-size: .75rem; font-weight: 700; line-height: 20px; }
  #cartback { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .25s; }
  #cartback.open { opacity: 1; pointer-events: auto; }
  #cartdrawer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; max-width: 560px; margin: 0 auto; max-height: 86%; display: flex; flex-direction: column;
                background: #fff; color: #222; border-radius: 20px 20px 0 0; box-shadow: 0 -6px 30px rgba(0,0,0,.2);
                transform: translateY(105%); transition: transform .3s; padding-bottom: env(safe-area-inset-bottom, 0px); visibility: hidden; }
  #cartdrawer.open { transform: none; visibility: visible; }
  #cartdrawer header { display: flex; align-items: center; gap: 10px; padding: 16px 18px 10px; }
  #cartdrawer h2 { margin: 0; font-size: 1.2rem; flex: 1; }
  #carttable { color: #666; font-size: .9rem; }
  #cartclose { width: 36px; height: 36px; padding: 0; border-radius: 50%; background: #f1f1f1; color: #333; }
  #cartlist { overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; padding: 0 18px; min-height: 60px; }
  #cartempty { padding: 28px 18px; text-align: center; color: #777; }
  .crow { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #eee; }
  .cinfo { flex: 1; min-width: 0; }
  .cname { font-weight: 600; }
  .cprice { color: #666; font-size: .85rem; margin-top: 2px; }
  .cqty { display: flex; align-items: center; gap: 8px; }
  .cn { min-width: 1.6em; text-align: center; font-weight: 700; }
  .cbtn { width: 34px; height: 34px; padding: 0; border-radius: 50%; background: #f1f1f1; color: #222; font-size: 1.1rem; font-weight: 700; }
  .cbtn.cdel { background: none; color: #b33; font-size: .95rem; }
  #cartdrawer footer { padding: 12px 18px 16px; border-top: 1px solid #eee; }
  #cartdrawer .line { display: flex; justify-content: space-between; font-size: 1.15rem; margin-bottom: 8px; }
  #carterr { color: #c0392b; font-size: .85rem; min-height: 1.1em; margin-bottom: 6px; }
  #cartconfirm { width: 100%; padding: 15px; border-radius: 999px; background: #e8452c; color: #fff; font-weight: 700; }
  #cartclear { width: 100%; margin-top: 8px; padding: 10px; border-radius: 999px; background: none; color: #777; font-size: .9rem; }
  #cartconfirm:disabled, #cartclear:disabled { opacity: .45; }
  #orderstatus { position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(0,0,0,.45); }
  #orderstatus.open { display: flex; }
  #orderstatus .card { background: #fff; color: #222; width: 100%; max-width: 340px; border-radius: 22px; padding: 28px 24px 22px; text-align: center; }
  #osicon { font-size: 2.6rem; }
  #ostitle { margin: 8px 0 6px; font-size: 1.3rem; }
  #osmsg { margin: 0 auto 10px; color: #444; line-height: 1.5; max-width: 28ch; }
  #osmeta { margin: 0 0 16px; color: #888; font-size: .85rem; max-width: none; }
  #osclose { padding: 12px 36px; border-radius: 999px; background: #e8452c; color: #fff; font-weight: 700; }
  #orderpill { display: none; position: fixed; top: calc(64px + env(safe-area-inset-top, 0px)); right: 12px; z-index: 40; padding: 7px 14px; border-radius: 999px;
               background: #1a1a1a; color: #fff; font-size: .85rem; }
  /* Add buttons */
  #start .ui #addcart { display: none; background: #1fa855; color: #fff; }
  body.ordering-on #start .ui #addcart { display: block; }
  [data-add][hidden] { display: none !important; }
  .hub .card .add { display: none; width: calc(100% - 24px); margin: 0 12px 12px; padding: 10px; border: 0; border-radius: 999px; background: #1fa855; color: #fff; font: inherit; font-weight: 600; }
  body.ordering-on .hub .card .add { display: block; }
  /* "Menu" link on a dish page */
  #menulink { display: none; position: absolute; left: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 4;
              font-size: .9rem; color: #444; background: rgba(255,255,255,.92); border: 1px solid #ddd; border-radius: 999px;
              padding: 6px 14px; text-decoration: none; }
  #start.only3d #menulink { display: none !important; }
  /* Loading bar for the 3D dish */
  #bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; z-index: 6; pointer-events: none; }
  #bar i { display: block; height: 100%; width: 0; background: #e8452c; transition: width .25s; }
</style>
</head>
<body>

<!-- 1. Start screen: live 3D preview of the dish + ways to view it -->
<div class="screen on" id="start">
  <div id="bar"><i></i></div>
  <a id="menulink" href="./">&#8249; Menu</a>

  <!-- max-camera-orbit: the camera can go from straight above down to just above the table, never below the dish -->
  <model-viewer id="mv" alt="3D dish" camera-controls auto-rotate interaction-prompt="none" disable-pan
                max-camera-orbit="auto 87deg auto"
                ar ar-modes="scene-viewer quick-look" shadow-intensity="1" shadow-softness="0.9" exposure="1.1" loading="eager">
    <button slot="ar-button" style="display:none"></button>
  </model-viewer>

  <div class="top">
    <h1 id="dname">See your dish in 3D</h1>
    <p id="price" style="display:none"></p>
    <p id="sub">Loading your 3D dish…</p>
  </div>

  <div class="ui">
    <button id="go">Scan the menu photo</button>
    <button id="ar" class="alt" style="display:none">View in your space (AR)</button>
    <button class="plain" id="skip">View 3D without camera</button>
    <button id="addcart">Add to cart</button>
    <button class="wa" id="wa">Order on WhatsApp</button>
    <button class="plain" id="info" style="display:none">Details</button>
  </div>

  <div id="sheet"><div class="card">
    <h2 id="sname"></h2><p id="sdesc"></p><p id="sing"></p><p id="sall"></p>
    <button class="plain" id="sclose">Close</button>
  </div></div>

  <!-- shown when "View 3D without camera" is tapped -->
  <div class="back3d">
    <button class="plain" id="back">Back</button>
    <button id="ar2" class="alt" style="display:none">View in your space (AR)</button>
  </div>
</div>

<!-- 3. Error message -->
<div class="screen" id="error">
  <h1 id="errtitle">Camera not available</h1>
  <p id="errmsg">Allow camera access in your browser, or view the dish in 3D instead.</p>
  <p id="errcode"></p>
  <button id="errretry">Try again</button>
  <button class="plain" id="err3d">View 3D</button>
</div>


<!-- Cart, order status (hidden until ordering is switched on in app.js) -->
<div id="cartui" data-keep>
  <button id="cartfab" type="button" aria-label="Open your cart">&#128722;<span id="cartbadge">0</span></button>
  <div id="orderpill" role="button" tabindex="0"></div>
  <div id="cartback"></div>
  <section id="cartdrawer" role="dialog" aria-label="Your order">
    <header><h2>Your order</h2><span id="carttable"></span><button id="cartclose" type="button" aria-label="Close">&#10005;</button></header>
    <div id="cartlist"></div>
    <div id="cartempty">Your cart is empty. Tap "Add" on a dish.</div>
    <footer>
      <!-- ADD THIS NAME INPUT HERE -->
      <input id="custname" type="text" placeholder="Your Name (Optional)" style="width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font: inherit; outline: none;">
      
      <div class="line"><span>Total</span><strong id="carttotal">Rs 0</strong></div>
      <div id="carterr" role="alert"></div>
      <button id="cartconfirm" type="button">Confirm Order</button>
      <button id="cartclear" type="button">Delete all</button>
    </footer>
  </section>
  <div id="orderstatus"><div class="card" role="status" aria-live="polite">
    <div id="osicon"></div><h3 id="ostitle"></h3><p id="osmsg"></p><p id="osmeta"></p><button id="osclose" type="button">OK</button>
  </div></div>
</div>

<div id="arlabel"><span class="rn" id="arlabel-rest"></span><span id="arlabel-name"></span><span class="pr" id="arlabel-price"></span></div>
<div id="hud"><button id="detach">Detach</button><button id="mode" style="display:none">Drag: Rotate</button><button id="hud3d">3D view</button></div>
<div id="aractions"><button id="hudadd" type="button">+ Add to cart</button><button id="hudphoto" type="button">📷 Photo</button></div>
<div id="hint"></div>

<script>
(function () {
  const $ = id => document.getElementById(id);

  // If dishes.js has a typing mistake (usually a missing comma), say so instead of staying on "Loading..." forever
  if (typeof DISHES === 'undefined' || typeof RESTAURANT === 'undefined') {
    $('sub').textContent = 'Menu file problem: dishes.js has a typing mistake (usually a missing comma). Check the last line you edited.';
    $('sub').style.color = '#c0392b'; $('bar').style.display = 'none'; $('go').style.display = 'none';
    return;
  }

  // ---------- Which dish? (?item=... from the QR link) ----------
  const key = new URLSearchParams(location.search).get('item');
  const DISH = DISHES[key];
  if (!DISH) { showMenuPage(key); return; }

  // Load the 3D viewer only on a dish page (the menu page does not need it)
  { const vs = document.createElement('script'); vs.type = 'module';
    vs.src = 'https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js'; document.head.appendChild(vs); }

  // ---------- The menu page: one QR code opens this, the customer taps a dish ----------
  function showMenuPage(missingKey) {
    const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    document.documentElement.style.cssText = 'height:auto;overflow:auto;touch-action:auto;background:#fff';
    document.body.style.cssText = 'height:auto;overflow:auto;touch-action:auto;user-select:auto;-webkit-user-select:auto;background:#fff;color:#222';
    [...document.body.children].forEach(c => { if (!c.hasAttribute('data-keep') && c.tagName !== 'SCRIPT') c.remove(); });
    const css = document.createElement('style');
    css.textContent = '.hub{max-width:680px;margin:0 auto;padding:calc(56px + env(safe-area-inset-top,0px)) 16px 48px}' +
      '.hub h1{font-size:1.7rem;margin:0 0 6px;text-align:center;color:#1a1a1a}' +
      '.hub .lead{color:#666;text-align:center;margin:0 auto 22px;max-width:34ch;line-height:1.5}' +
      '.hub .warn{background:#fff4e5;color:#8a5a00;border-radius:12px;padding:10px 14px;margin:0 0 16px;text-align:center}' +
      '.hub .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}' +
      '@media(min-width:560px){.hub .grid{grid-template-columns:repeat(3,1fr)}}' +
      '.hub .card{display:flex;flex-direction:column;border:1px solid #e6e6e6;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.06)}' +
      '.hub .clink{display:block;flex:1;text-decoration:none;color:inherit}' +
      '.hub .pic{aspect-ratio: 4/3; background:#fafafa; display:flex; align-items:center; justify-content:center; padding: 10px;}' +
      ' .hub .pic img{width:100%; height:100%; object-fit:contain}' +
      '.hub .pic span{font-size:2.4rem}' +
      '.hub .info{padding:10px 12px 12px}' +
      '.hub .nm{font-weight:600;font-size:1rem;margin:0;color:#1a1a1a}' +
      '.hub .pr{color:#666;font-size:.9rem;margin:2px 0 0}' +
      '.hub .tag{display:inline-block;margin-top:8px;font-size:.8rem;color:#e8452c;font-weight:600}';
    document.head.appendChild(css);
    const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; };
    const wrap = mk('div', 'hub');
    wrap.appendChild(mk('h1', '', RESTAURANT.name || 'Menu'));
    wrap.appendChild(mk('div', 'lead', ios ? 'Tap a dish, then "View in your space" to put it on your table.'
                                           : 'Tap a dish to see it in 3D, or scan its photo on the menu with your camera.'));
    if (missingKey) wrap.appendChild(mk('div', 'warn', 'That dish was not found. Please choose from the menu below.'));
    const grid = mk('div', 'grid');
    Object.keys(DISHES).forEach(k => {
      const d = DISHES[k];
      const card = mk('div', 'card');
      const a = mk('a', 'clink'); const _t = new URLSearchParams(location.search).get('table'); a.href = '?item=' + encodeURIComponent(k) + (_t ? '&table=' + encodeURIComponent(_t) : '');
      const pic = mk('div', 'pic');
      if (d.poster) { const im = new Image(); im.alt = d.name; im.loading = 'lazy'; im.decoding = 'async'; im.src = d.poster; pic.appendChild(im); }
      else pic.appendChild(mk('span', '', '🍽'));
      const info = mk('div', 'info');
      info.appendChild(mk('p', 'nm', d.name));
      if (d.price) info.appendChild(mk('p', 'pr', d.price));
      info.appendChild(mk('span', 'tag', 'View in 3D ›'));
      a.appendChild(pic); a.appendChild(info); card.appendChild(a);
      const add = mk('button', 'add', '+ Add'); add.type = 'button'; add.setAttribute('data-add', k); card.appendChild(add);
      grid.appendChild(card);
    });
    wrap.appendChild(grid);
    document.body.appendChild(wrap);
    document.title = RESTAURANT.name || 'Menu';
  }

  // ---------- Settings you may change ----------
  const SHOW_AR_ON_ANDROID = false;       // Android: off. The phone check is not reliable enough (set true to experiment)
  const PRELOAD_AR_ON_IOS = false;        // iPhone mostly uses "View in your space", so the camera engine loads only when needed

            animation__ringpulse="property: material.opacity; from: 0.5; to: 0.9; dur: 2000; dir: alternate; loop: true; easing: easeInOutSine">
          </a-ring>
          <a-plane class="sparkle-burst" src="dishes/sparkle.png" position="-0.60 0.35 0.15" width="0.12" height="0.12" material="transparent: true; opacity: 0; depthWrite: false" animation__burst="property: scale; from: 0 0 0; to: 1.5 1.5 1.5; dur: 600; startEvents: sparklestart; easing: easeOutBack" animation__fadein="property: material.opacity; from: 0; to: 1; dur: 300; startEvents: sparklestart" animation__fadeout="property: material.opacity; from: 1; to: 0; dur: 800; delay: 500; startEvents: sparklestart"></a-plane>
          <a-plane class="sparkle-burst" src="dishes/sparkle.png" position="0.60 0.35 0.15" width="0.12" height="0.12" material="transparent: true; opacity: 0; depthWrite: false" animation__burst="property: scale; from: 0 0 0; to: 1.5 1.5 1.5; dur: 600; startEvents: sparklestart; easing: easeOutBack" animation__fadein="property: material.opacity; from: 0; to: 1; dur: 300; startEvents: sparklestart" animation__fadeout="property: material.opacity; from: 1; to: 0; dur: 800; delay: 500; startEvents: sparklestart"></a-plane>
          <a-plane class="sparkle-burst" src="dishes/sparkle.png" position="-0.45 -0.45 0.15" width="0.10" height="0.10" material="transparent: true; opacity: 0; depthWrite: false" animation__burst="property: scale; from: 0 0 0; to: 1.5 1.5 1.5; dur: 600; startEvents: sparklestart; easing: easeOutBack" animation__fadein="property: material.opacity; from: 0; to: 1; dur: 300; startEvents: sparklestart" animation__fadeout="property: material.opacity; from: 1; to: 0; dur: 800; delay: 500; startEvents: sparklestart"></a-plane>
          <a-plane class="sparkle-burst" src="dishes/sparkle.png" position="0.45 -0.45 0.15" width="0.10" height="0.10" material="transparent: true; opacity: 0; depthWrite: false" animation__burst="property: scale; from: 0 0 0; to: 1.5 1.5 1.5; dur: 600; startEvents: sparklestart; easing: easeOutBack" animation__fadein="property: material.opacity; from: 0; to: 1; dur: 300; startEvents: sparklestart" animation__fadeout="property: material.opacity; from: 1; to: 0; dur: 800; delay: 500; startEvents: sparklestart"></a-plane>
          <a-plane class="sparkle-burst" src="dishes/sparkle.png" position="0 0.65 0.15" width="0.14" height="0.14" material="transparent: true; opacity: 0; depthWrite: false" animation__burst="property: scale; from: 0 0 0; to: 1.5 1.5 1.5; dur: 600; startEvents: sparklestart; easing: easeOutBack" animation__fadein="property: material.opacity; from: 0; to: 1; dur: 300; startEvents: sparklestart" animation__fadeout="property: material.opacity; from: 1; to: 0; dur: 800; delay: 500; startEvents: sparklestart"></a-plane>
          <a-plane class="sparkle-burst" src="dishes/sparkle.png" position="-0.70 0 0.15" width="0.10" height="0.10" material="transparent: true; opacity: 0; depthWrite: false" animation__burst="property: scale; from: 0 0 0; to: 1.5 1.5 1.5; dur: 600; startEvents: sparklestart; easing: easeOutBack" animation__fadein="property: material.opacity; from: 0; to: 1; dur: 300; startEvents: sparklestart" animation__fadeout="property: material.opacity; from: 1; to: 0; dur: 800; delay: 500; startEvents: sparklestart"></a-plane>
          <a-plane class="sparkle-burst" src="dishes/sparkle.png" position="0.70 0 0.15" width="0.10" height="0.10" material="transparent: true; opacity: 0; depthWrite: false" animation__burst="property: scale; from: 0 0 0; to: 1.5 1.5 1.5; dur: 600; startEvents: sparklestart; easing: easeOutBack" animation__fadein="property: material.opacity; from: 0; to: 1; dur: 300; startEvents: sparklestart" animation__fadeout="property: material.opacity; from: 1; to: 0; dur: 800; delay: 500; startEvents: sparklestart"></a-plane>
          <a-plane class="sparkle-burst" src="dishes/sparkle.png" position="0 -0.65 0.15" width="0.12" height="0.12" material="transparent: true; opacity: 0; depthWrite: false" animation__burst="property: scale; from: 0 0 0; to: 1.5 1.5 1.5; dur: 600; startEvents: sparklestart; easing: easeOutBack" animation__fadein="property: material.opacity; from: 0; to: 1; dur: 300; startEvents: sparklestart" animation__fadeout="property: material.opacity; from: 1; to: 0; dur: 800; delay: 500; startEvents: sparklestart"></a-plane>
          <a-plane src="dishes/sparkle.png" position="-0.30 0.55 0.15" width="0.08" height="0.08" material="transparent: true; opacity: 0; depthWrite: false" animation__twinkle="property: material.opacity; from: 0; to: 0.9; dur: 1500; dir: alternate; loop: true; easing: easeInOutSine"></a-plane>
          <a-plane src="dishes/sparkle.png" position="0.35 0.50 0.15" width="0.08" height="0.08" material="transparent: true; opacity: 0; depthWrite: false" animation__twinkle="property: material.opacity; from: 0; to: 0.9; dur: 1800; delay: 600; dir: alternate; loop: true; easing: easeInOutSine"></a-plane>
          <a-plane src="dishes/sparkle.png" position="-0.50 -0.20 0.15" width="0.07" height="0.07" material="transparent: true; opacity: 0; depthWrite: false" animation__twinkle="property: material.opacity; from: 0; to: 0.9; dur: 1300; delay: 1200; dir: alternate; loop: true; easing: easeInOutSine"></a-plane>
          <a-plane src="dishes/sparkle.png" position="0.50 -0.25 0.15" width="0.07" height="0.07" material="transparent: true; opacity: 0; depthWrite: false" animation__twinkle="property: material.opacity; from: 0; to: 0.9; dur: 2100; delay: 900; dir: alternate; loop: true; easing: easeInOutSine"></a-plane>
          ` : ''}

          <!-- 1-second light flash when the pizza pops up
               (triggered in targetFound, below) -->
          <a-plane
            id="flash"
            color="#ffffff"
            position="0 0 0.45"
            width="1.6"
            height="1.6"
            transparent="true"
            material="transparent: true; opacity: 0; depthWrite: false"
            animation__flash="property: material.opacity; from: 0.7; to: 0; dur: 1000; easing: easeOutQuad; startEvents: flashstart">
          </a-plane>

        </a-entity>
      </a-entity>
    </a-entity>
  </a-entity>
</a-scene>`);
  }

  // Runs every frame: keeps the camera from ever seeing the underside of the dish
  function registerHideBottom() {
    AFRAME.registerComponent('hide-bottom', { tick() { try { if (window.__limitTilt) window.__limitTilt(); } catch (e) {} } });
  }

  // ---------- Starting the camera ----------
  const sys = () => scene.systems['mindar-image-system'];
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
  const hasWebGL = () => { try { const c = document.createElement('canvas'); return !!(c.getContext('webgl') || c.getContext('experimental-webgl')); } catch (e) { return false; } };

  // After a failure, test the camera directly so we can tell "camera problem" from "AR engine problem"
  async function diagnose(e) {
    const base = 'webgl:' + (hasWebGL() ? 'yes' : 'no');
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      s.getTracks().forEach(t => t.stop());
      return { cam: true, code: base + ' · ' + (lastArError || (e && (e.name || e.message)) || 'unknown') };
    } catch (ce) {
      return { cam: false, name: ce.name || '', code: base + ' · ' + (ce.name || 'camera error') };
    }
  }

  async function startAR() {
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showError('Camera not supported', 'This browser cannot open the camera. Open the link in Chrome or Safari, or view 3D instead.', 'no getUserMedia');
      return;
    }
    hint('Starting camera…');
    $('start').classList.remove('on');
    document.body.classList.add('hide-fab');   // the cart button would sit on top of the camera view
    lastArError = '';
    try {
      try { await withTimeout(sys().start(), 30000); }
      catch (e1) {
        try { sys().stop(); } catch (_) {}
        await new Promise(r => setTimeout(r, 700));
        await withTimeout(sys().start(), 30000);   // one silent retry
      }
      started = true;
      $('hud').style.display = 'block';
      $('aractions').style.display = 'flex';
      // Label stays hidden here - it only appears when the target photo is found and the pizza pops up (see targetFound below).
      hint('Point at the dish photo on the menu');
    } catch (e) {
      console.error(e);
      try { sys().stop(); } catch (_) {}
      hint('');
      const d = await diagnose(e);
      if (d.cam) {
        showError('AR could not start', 'The camera works, but this phone or browser could not run the AR engine. Open the link in Chrome (updated), or use the 3D view.', d.code);
      } else {
        let msg = 'The browser could not open the camera.';
        if (/NotAllowed|Security/.test(d.name)) msg = 'The camera is blocked for this site. Tap the lock icon next to the address, choose Permissions, then Camera, then Allow, and reload. Also check Android Settings > Apps > your browser > Permissions > Camera.';
        else if (/NotReadable/.test(d.name)) msg = 'Another app is using the camera. Close it and try again.';
        else if (/NotFound|Overconstrained/.test(d.name)) msg = 'No usable camera was found on this phone.';
        showError('Camera not available', msg, d.code);
      }
    }
  }

  // "Scan the menu photo": the button is never locked. If the camera engine is not ready yet, the customer can keep
  // playing with the 3D dish; the camera opens by itself as soon as it is ready. Tapping again cancels the wait.
  $('go').onclick = () => {
    if (arReady) { startAR(); return; }
    if (wantAR) { wantAR = false; resetGo(); hint(''); return; }
    wantAR = true;
    $('go').textContent = 'Camera opens when ready… (tap to cancel)';
    if (heroFinished) startEngine();    // otherwise heroDone() starts it right after the dish has loaded
  };

  // Photo: render the AR scene fresh, then composite camera video + WebGL canvas in the same frame.
  // The old version waited 120ms after hiding the buttons - by then the WebGL canvas had already been
  // cleared, so the shared photo had only the camera floor and no pizza. This version draws immediately
  // after a fresh render, so the pizza is in the photo.
  $('hudphoto').onclick = async () => {
    const labelWasShown = $('arlabel').style.display === 'block';
    try {
      const video = document.querySelector('#scene video') || document.querySelector('video');
      const gl = scene && scene.canvas;
      if (!video || !video.videoWidth || !gl || !gl.width) { hint('Take a screenshot with your phone buttons instead'); return; }
      $('hud').style.display = 'none'; $('aractions').style.display = 'none'; $('arlabel').style.display = 'none'; hint('');
      await new Promise(r => requestAnimationFrame(r));
      if (scene.renderer) scene.renderer.render(scene.object3D, scene.camera);
      const W = gl.width, H = gl.height;
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const x = c.getContext('2d');
      const s = Math.max(W / video.videoWidth, H / video.videoHeight);
      const vw = video.videoWidth * s, vh = video.videoHeight * s;
      x.drawImage(video, (W - vw) / 2, (H - vh) / 2, vw, vh);
      x.drawImage(gl, 0, 0, W, H);
      const barH = Math.round(H * 0.09);
      x.fillStyle = 'rgba(0,0,0,0.72)'; x.fillRect(0, H - barH, W, barH);
      x.fillStyle = '#FFC20F'; x.textAlign = 'center';
      const fs = Math.round(H * 0.028);
      x.font = 'bold ' + fs + 'px system-ui, sans-serif';
      x.fillText((RESTAURANT.name || 'Melt9').toUpperCase(), W / 2, H - barH + fs + 8);
      x.fillStyle = '#ffffff';
      x.fillText(DISH.name + '  •  Rs ' + DISH.price, W / 2, H - barH + fs * 2 + 14);
      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.92));
      if (!blob) throw new Error('photo failed');
      const file = new File([blob], 'melt9-' + key + '.jpg', { type: 'image/jpeg' });
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], text: DISH.name + ' at ' + (RESTAURANT.name || '') });
      } else {
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      }
      hint('Photo saved ✓  Share it and tag ' + (RESTAURANT.name || 'Melt9'));
    } catch (e) { hint('Photo did not save — take a screenshot with your phone buttons instead'); }
    $('hud').style.display = 'block'; $('aractions').style.display = 'flex'; if (labelWasShown) $('arlabel').style.display = 'block';
  };

  function stopAR() {
    try { if (started) sys().stop(); } catch (e) {}
    started = false;
    if (window.__attachBack) window.__attachBack(false);
    $('hud').style.display = 'none';
    $('aractions').style.display = 'none';
    $('arlabel').style.display = 'none';
    hint('');
  }
  function open3D() { stopAR(); show('start'); $('start').classList.add('only3d'); document.body.classList.add('hide-fab'); }

  $('skip').onclick = open3D;
  $('err3d').onclick = open3D;
  $('errretry').onclick = () => show('start');
  $('hud3d').onclick = open3D;
  $('back').onclick = () => { show('start'); };

  // ---------- Step 3: touch controls and detach (set up once the AR scene exists) ----------
  function initAR() {
    const T = AFRAME.THREE, D2R = Math.PI / 180;
    const pop = $('pop'), tilt = $('tilt'), spin = $('spin'), zoom = $('zoom'), t0 = $('t0'), dbtn = $('detach');
    let found = false, detached = false, gone = true, goneTimer = null, moveMode = false;
    let rx = 0, rz = 0, zv = 1;

    scene.addEventListener('arError', ev => { lastArError = (ev.detail && ev.detail.error) || 'arError'; });

    // Pop-up + 360 spin (1.5s). Replays only if the photo was lost for more than 1.2s.
    const playPop = () => pop.emit('popstart');
    t0.addEventListener('targetFound', () => {
      found = true; clearTimeout(goneTimer);
      $('arlabel').style.display = 'block';   // exact time the pizza is loaded / pops up
      const fl = document.getElementById('flash'); if (fl) fl.emit('flashstart');   // 1-second light flash
      document.querySelectorAll('.sparkle-burst').forEach(el => el.emit('sparklestart'));   // gold sparkle burst on pop (McArt test)
      if (!detached) hint('Drag to rotate · pinch to zoom');
      if (!detached && gone) { gone = false; playPop(); }
    });
    t0.addEventListener('targetLost', () => {
      found = false;
      if (!detached) { $('arlabel').style.display = 'none'; hint('Point at the dish photo on the menu'); }
      clearTimeout(goneTimer);
      goneTimer = setTimeout(() => { gone = true; }, 1200);
    });

    // ----- Never show the underside -----
    // The dish's "up" direction is the +Z axis of the tilt group. Looking from the camera, the base is hidden as long as the camera
    // stays above the base plane, i.e. dot(up, direction-to-camera) >= MIN_ELEVATION_SIN * distance. This limits the tilt angle (rx)
    // every frame, whether the dish sits on the menu photo or is detached, and whatever way the phone is held.
    const vA = new T.Vector3(), vB = new T.Vector3(), qA = new T.Quaternion();
    let tiltErrors = 0;
    window.__limitTilt = function () {
      if (!HIDE_BOTTOM_IN_AR || tiltErrors > 3) return;       // switched off by the setting, or it failed repeatedly
      try {
        if (!found && !detached) return;                      // nothing is visible, nothing to limit
        if (!isFinite(rx)) { rx = 0; tilt.object3D.rotation.x = 0; }
        const cam = scene.camera; if (!cam) return;
        pop.object3D.getWorldPosition(vA);
        cam.getWorldPosition(vB);
        vB.sub(vA);                          // from the dish to the camera
        pop.object3D.getWorldQuaternion(qA);
        vB.applyQuaternion(qA.invert());     // the same direction in the dish's own frame
        const L = vB.length(), R = Math.hypot(vB.y, vB.z);
        if (!isFinite(L) || !isFinite(R) || L < 1e-6 || R < 1e-6) return;
        const t = MIN_ELEVATION_SIN * L / R;
        if (t >= 1) return;
        const half = Math.acos(t) / D2R;     // allowed tilt: mid - half ... mid + half (degrees)
        let mid = -Math.atan2(vB.y, vB.z) / D2R;
        mid += 360 * Math.round((rx - mid) / 360);
        const nrx = Math.max(mid - half, Math.min(mid + half, rx));
        if (isFinite(nrx) && nrx !== rx) { rx = nrx; tilt.object3D.rotation.x = rx * D2R; }
      } catch (err) {
        tiltErrors++; console.warn('hide-bottom skipped:', err);   // never let this stop the camera view
      }
    };

    // ----- Detach: move the model from the photo onto the camera, keeping its current size/position -----
    function attachBack(playAnim) {
      if (!detached) return;
      t0.object3D.add(pop.object3D);
      pop.object3D.position.set(0, 0, 0); pop.object3D.quaternion.identity(); pop.object3D.scale.set(1, 1, 1);
      zv = 1; zoom.object3D.scale.setScalar(1);
      detached = false; dbtn.textContent = 'Detach';
      $('arlabel').style.display = found ? 'block' : 'none';
      moveMode = false; $('mode').textContent = 'Drag: Rotate'; $('mode').style.display = 'none';
      hint(found ? '' : 'Point at the dish photo on the menu');
      if (found && playAnim !== false) playPop();
    }
    window.__attachBack = attachBack;
    dbtn.onclick = () => {
      if (!detached) {
        if (!found) { hint('Point at the dish photo first'); return; }
        document.querySelector('a-camera').object3D.attach(pop.object3D);
        detached = true; dbtn.textContent = 'Attach back';
        $('mode').style.display = 'inline-block';
        hint('Drag to rotate · pinch to zoom · two fingers to move');
      } else attachBack(true);
    };

    // ----- Gestures: one finger = rotate/tilt, two fingers = pinch zoom -----
    $('mode').onclick = () => {
      moveMode = !moveMode;
      $('mode').textContent = moveMode ? 'Drag: Move' : 'Drag: Rotate';
    };

    // Slide the detached model across the screen (pixels -> camera-space units at the model's depth)
    function pan(dx, dy) {
      const o = pop.object3D.position;
      const f = scene.camera && scene.camera.projectionMatrix.elements[5];
      const h = (scene.canvas && scene.canvas.clientHeight) || window.innerHeight;
      const k = f ? (2 * (Math.abs(o.z) || 1)) / (f * h) : 0.002;
      o.x += dx * k; o.y -= dy * k;
    }

    // Zoom around a screen point (instead of the model centre), so you can zoom into any part of the dish
    function zoomAbout(mx, my, r) {
      const o = pop.object3D.position, m = scene.camera && scene.camera.projectionMatrix.elements;
      if (!m || !m[0] || !m[5]) return;
      const W = (scene.canvas && scene.canvas.clientWidth) || window.innerWidth;
      const H = (scene.canvas && scene.canvas.clientHeight) || window.innerHeight;
      const z = Math.abs(o.z) || 1;
      const cx = ((mx - W / 2) / (W / 2)) * z / m[0];
      const cy = (-(my - H / 2) / (H / 2)) * z / m[5];
      o.x = cx + (o.x - cx) * r; o.y = cy + (o.y - cy) * r;
    }

    const pts = new Map(); let lastD = 0;
    const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
    addEventListener('pointerdown', e => {
      if (!started || e.target.closest('button')) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 2) lastD = dist();
    });
    addEventListener('pointermove', e => {
      const p = pts.get(e.pointerId); if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;
      if (pts.size === 1) {
        if (detached && moveMode) pan(dx, dy);
        else {
          rz += dx * 0.6; rx += dy * 0.4;              // the underside limit is applied every frame by __limitTilt
          spin.object3D.rotation.z = rz * D2R; tilt.object3D.rotation.x = rx * D2R;
          window.__limitTilt();
        }
      } else if (pts.size === 2) {
        const d = dist();
        const ratio = (lastD && d) ? d / lastD : 1;
        const nz = Math.min(1e7, Math.max(1e-3, zv * ratio));   // no practical limit
        const r = nz / zv; zv = nz; lastD = d;
        zoom.object3D.scale.setScalar(zv);
        if (detached) {
          const [a, b] = [...pts.values()];
          zoomAbout((a.x + b.x) / 2, (a.y + b.y) / 2, r);   // keep the spot between your fingers in place
          pan(dx / 2, dy / 2);                              // the midpoint of two fingers moves half as far as each finger
        }
      }
    });
    ['pointerup', 'pointercancel'].forEach(t => addEventListener(t, e => pts.delete(e.pointerId)));

    // ----- Auto-rotate: pizza spins slowly by itself, pauses while you touch it, resumes when you lift your fingers -----
    // pts.size > 0 means a finger is on the screen (drag / pinch). When it is 0, no finger is touching, so spin again.
    let lastT = performance.now();
    const autoSpin = (now) => {
      const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now;   // seconds since last frame, max 0.1s
      if (started && pts.size === 0 && (found || detached)) {
        rz += dt * 25;   // 25 degrees per second = one full turn in about 14 seconds
        spin.object3D.rotation.z = rz * D2R;
      }
      requestAnimationFrame(autoSpin);
    };
    requestAnimationFrame(autoSpin);
  }
})();
</script>
</body>
